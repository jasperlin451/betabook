name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is gitignored and `wrangler types` derives it
      # from wrangler.jsonc *and* .dev.vars. Without this copy CloudflareEnv
      # lacks RESEND_API_KEY and lib/email.ts fails the build's typecheck.
      - name: Generate Cloudflare env types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dead code check
        run: pnpm deadcode

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm exec opennextjs-cloudflare build

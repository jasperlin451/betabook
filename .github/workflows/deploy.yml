name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize deploys on main so two quick merges can't land out of order, but
# cancel in-progress runs on PR branches when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    # The test suite takes about 3.5 minutes on this runner; setup, checks,
    # the production build, and post-job cleanup need room beyond five minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm, Node, and the dependencies, so there is no separate
      # install step. Caches the store and pnpm's minimumReleaseAge verdict.
      # Not @v2 -- that tag still resolves to v2.0.2, which has neither the
      # verdict cache nor require-lockfile, and only warns on the latter.
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # worker-configuration.d.ts is gitignored and `wrangler types` derives it
      # from wrangler.jsonc *and* .dev.vars. Without this copy CloudflareEnv
      # lacks RESEND_API_KEY and lib/email.ts fails the build's typecheck.
      - name: Generate Cloudflare env types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dead code check
        run: pnpm deadcode

      - name: Type check
        run: pnpm typecheck

      # The Vitest worker applies every D1 migration to a fresh database, so
      # this catches migration and query regressions before production changes.
      - name: Test
        run: pnpm test

      # Split from the deploy step below: `next build` typechecks, so a broken
      # compile stops here instead of shipping.
      - name: Build
        run: pnpm exec opennextjs-cloudflare build

  # A runner has four cores and must also host the gallery preview and
  # `next dev`, so the run keeps two Playwright workers and buys its speed by
  # splitting each project across runners instead. Raising the workers starves
  # the dev server and the app tests miss their navigation timeouts.
  ui-tests:
    name: UI (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-light, desktop-dark, mobile-light, mobile-dark]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # Playwright pins the browser build to its own version, so the lockfile is
      # the cache key. Without this every job re-downloads Chromium.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      # The worker count is chosen against the runner's cores, so record what
      # this job actually got; a change in runner size changes that choice.
      - name: Report runner size
        run: 'echo "cores: $(nproc)  memory: $(free -g | awk ''/^Mem:/ {print $2}'')GB"'
      - name: Prepare local app environment
        run: cp .dev.vars.example .dev.vars
      - name: Build component gallery
        run: pnpm storybook:build
      - name: Check component gallery and app branding
        run: >-
          pnpm exec playwright test --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/2
      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-reference-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui:
    name: UI reference
    needs: [ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every viewport and theme to pass
        env:
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: test "$UI_RESULT" = success

  deploy:
    name: Deploy
    needs: [test, ui]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jasperlin451/betabook'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm, Node, and the dependencies, so there is no separate
      # install step. Caches the store and pnpm's minimumReleaseAge verdict.
      # Not @v2 -- that tag still resolves to v2.0.2, which has neither the
      # verdict cache nor require-lockfile, and only warns on the latter.
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # worker-configuration.d.ts is gitignored and `wrangler types` derives it
      # from wrangler.jsonc *and* .dev.vars. Without this copy CloudflareEnv
      # lacks RESEND_API_KEY and lib/email.ts fails the build's typecheck.
      - name: Generate Cloudflare env types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen

      - name: Build
        run: pnpm exec opennextjs-cloudflare build

      # Ahead of the worker deploy so new code never meets an old schema. The
      # running worker does see the new schema for the seconds in between, so
      # each migration has to stay backward-compatible.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy
        run: pnpm exec opennextjs-cloudflare deploy

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize deploys on main so two quick merges can't land out of order, but
# cancel in-progress runs on PR branches when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # setup-node's `cache: pnpm` covers the package store but not pnpm's
      # cache dir, where the minimumReleaseAge verdict from pnpm-workspace.yaml
      # is recorded. Without it every run re-checks all 828 lockfile entries
      # against the registry. That check overlaps package linking, so restoring
      # it takes the step from 13.1s to 10.4s rather than saving its full ~12s.
      # Keyed on the lockfile and the policy, so a dependency change is still
      # verified from scratch.
      - name: Locate pnpm cache
        id: pnpm-cache
        run: echo "dir=$(pnpm cache path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is gitignored and `wrangler types` derives it
      # from wrangler.jsonc *and* .dev.vars. Without this copy CloudflareEnv
      # lacks RESEND_API_KEY and lib/email.ts fails the build's typecheck.
      - name: Generate Cloudflare env types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Dead code check
        run: pnpm deadcode

      - name: Type check
        run: pnpm typecheck

      # The Vitest worker applies every D1 migration to a fresh database, so
      # this catches migration and query regressions before production changes.
      - name: Test
        run: pnpm test

      # Split from the deploy step below: `next build` typechecks, so a broken
      # compile stops here instead of shipping.
      - name: Build
        run: pnpm exec opennextjs-cloudflare build

  deploy:
    name: Deploy
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'smwoo/betabook'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # setup-node's `cache: pnpm` covers the package store but not pnpm's
      # cache dir, where the minimumReleaseAge verdict from pnpm-workspace.yaml
      # is recorded. Without it every run re-checks all 828 lockfile entries
      # against the registry. That check overlaps package linking, so restoring
      # it takes the step from 13.1s to 10.4s rather than saving its full ~12s.
      # Keyed on the lockfile and the policy, so a dependency change is still
      # verified from scratch.
      - name: Locate pnpm cache
        id: pnpm-cache
        run: echo "dir=$(pnpm cache path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}/lockfile-verified.jsonl
          key: pnpm-verified-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts is gitignored and `wrangler types` derives it
      # from wrangler.jsonc *and* .dev.vars. Without this copy CloudflareEnv
      # lacks RESEND_API_KEY and lib/email.ts fails the build's typecheck.
      - name: Generate Cloudflare env types
        run: |
          cp .dev.vars.example .dev.vars
          pnpm cf-typegen

      - name: Build
        run: pnpm exec opennextjs-cloudflare build

      # Ahead of the worker deploy so new code never meets an old schema. The
      # running worker does see the new schema for the seconds in between, so
      # each migration has to stay backward-compatible.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy
        run: pnpm exec opennextjs-cloudflare deploy
